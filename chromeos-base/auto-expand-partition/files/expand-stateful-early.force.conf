description     "Expand the stateful partition before anything mounts it"
author          "openFyde"

# Held by upstart until it finishes, in the window between pre-startup and
# chromeos_startup -- the only point at which the stateful partition is not
# mounted. expand-stateful-early.sh explains why that matters: a partition can
# only be reshaped before it is mounted, and on a board that migrates stateful
# to an LVM thinpool the migration runs inside chromeos_startup and sizes the
# pool from the partition, so the expansion has to come first or the pool is
# stuck at the size the image shipped with.
#
# The old placement, "starting boot-services", ran after the mount. That was a
# whole boot too late: the first boot of a fresh image came up on ext4, and
# that is the boot on which ARC and Notialis install their DLCs.
start on starting startup

task

oom score -100

# -f: this board expands whatever it boots from, removable or not.
exec /usr/sbin/expand-stateful-early.sh -f
