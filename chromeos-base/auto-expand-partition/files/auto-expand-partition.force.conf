description     "Auto expand stateful partition on first boot"
author          "kraml@flintos.io, yang@fydeos.io"

start on starting boot-services

task

oom score -100

script
  auto_expanded_mark="/mnt/stateful_partition/unencrypted/preserve/.autoexpanded"
  if [ ! -f "$auto_expanded_mark" ]; then
    # The expansion itself now happens before anything mounts stateful, in
    # expand-stateful-early, which records the fact in the STATE partition's
    # own GPT attributes. It has to happen there: a partition can only be
    # reshaped while it is unmounted, and the LVM thinpool migration -- which
    # runs inside chromeos_startup and sizes the pool from the partition -- has
    # to come after it. This job still exists so that .autoexpanded goes on
    # meaning what it has always meant to everything else that reads it, and as
    # the fallback for a board where the early job did not get there.
    if ! /usr/sbin/expand-stateful-early.sh --is-expanded; then
      stateful_partition=$(findmnt -n -o source /mnt/stateful_partition)
      /usr/sbin/expand-partition.sh -f -d $stateful_partition > /tmp/auto-expand-partition 2>&1
    fi
    touch "$auto_expanded_mark" # croslint: disable:
  fi
end script
